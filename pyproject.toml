[project]
name = "noch26-wind"
version = "0.1.0"
description = "Workshop: forecasting wind from wind with numpy and PyTorch on open ERA5 data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
]

[tool.uv]
package = false

# CPU-only PyTorch wheels (about 4x smaller than the default CUDA build); macOS wheels on PyPI are CPU already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
